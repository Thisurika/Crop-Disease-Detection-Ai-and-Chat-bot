<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plant Disease Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* Force Chat Bubble to Float - Bypasses External Cache */
        .chat-bubble {
            position: fixed !important;
            bottom: 30px !important;
            right: 30px !important;
            background: #22c55e !important;
            color: white !important;
            padding: 16px 24px !important;
            border-radius: 50px !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3) !important;
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            cursor: pointer !important;
            transition: all 0.3s !important;
            z-index: 999999 !important;
        }

        .chat-bubble:hover {
            background: #16a34a !important;
            transform: scale(1.1) !important;
        }

        .chat-bubble i {
            font-size: 1.6rem !important;
        }

        .chat-container {
            position: fixed !important;
            bottom: 90px !important;
            right: 30px !important;
            width: 350px !important;
            height: auto !important;
            background: white !important;
            border-radius: 20px !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3) !important;
            overflow: hidden !important;
            z-index: 999999 !important;
            display: none;
            /* Initially hidden */
            flex-direction: column !important;
        }

        .chat-header {
            background: #2f855a !important;
            color: white !important;
            padding: 18px !important;
            text-align: center !important;
            font-size: 1.4rem !important;
            font-weight: 600 !important;
        }

        .chat-body {
            height: 340px !important;
            overflow-y: auto !important;
            padding: 25px !important;
            background: #fafafa !important;
        }

        .chat-input-area {
            display: flex !important;
            padding: 18px !important;
            border-top: 1px solid #e0e0e0 !important;
            background: white !important;
        }
    </style>
    <script>
        function toggleChat() {
            var cc = document.getElementById('chatContainer');
            if (cc.style.display === 'none' || cc.style.display === '') {
                cc.style.display = 'flex';
            } else {
                cc.style.display = 'none';
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <!-- Upload Card -->
        <div class="card upload-card">
            <h2>Upload Leaf Image</h2>
            <p>Upload an image of your plant leaf for AI analysis</p>

            <div class="upload-area" id="upload-area">
                <i class="fas fa-cloud-upload-alt fa-5x" id="upload-icon"></i>
                <p id="upload-text">Click "Choose Photo" or drag & drop here</p>
                <p>JPG, PNG, WEBP (MAX 5MB)</p>

                <!-- Hidden file input -->
                <input type="file" id="fileInput" accept="image/*" hidden /><br><br>

                <!-- Visible Choose Photo button -->
                <button id="choosePhotoBtn" class="choose-btn">Choose Photo</button><br><br>
            </div>

            <button id="detectBtn" class="btn" disabled>Detect Disease</button>
        </div>

        <!-- Result Card -->
        <div class="card result-card" id="resultCard" style="display: none;">
            <h2>Analysis Result</h2>

            <div class="result-item">
                <span class="label">Disease identified</span>
                <span class="value success" id="disease-name">—</span>
            </div>

            <div class="result-item">
                <span class="label">Confidence Level</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="confidence-bar" style="width: 0%;"></div>
                    <span class="progress-text" id="confidence-text">0%</span>
                </div>
            </div>

            <div class="result-item advice">
                <span class="label">Expert Advice</span>
                <p id="advice-text">Upload and analyze to get advice...</p>
            </div>

            <!-- Animated Agriculture Innovation GIF -->
            <div id="preview-anim"
                style="display: none; text-align: center; margin-top: 25px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
                <img src="https://cdn.dribbble.com/userupload/24439185/file/original-2c9b06bf14c1c8732d59221e3c498f9f.gif"
                    alt="Agriculture Innovation"
                    style="width: 100%; max-width: 400px; height: auto; display: block; margin: 0 auto;" />
                <p style="font-size: 0.8rem; color: #888; margin-top: 8px;"></p>
            </div>
        </div>
    </div>

    <!-- Chat Section (Floating) -->
    <div class="chat-container" id="chatContainer" style="display: none;">
        <div class="chat-header">
            <button id="closeChatBtn" onclick="toggleChat()"
                style="background: none; border: none; color: white; float: right; cursor: pointer; font-size: 1.2rem;"><i
                    class="fas fa-times"></i></button>
            <h3>Chat with Plant AI</h3>
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ask about treatment, prevention..." />
            <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Floating Chat Button -->
    <div class="chat-bubble" id="chatBubble" onclick="toggleChat()">
        <i class="fas fa-comment-dots"></i>
        <span>Chat with AI</span>
    </div>


    <script src="{{ url_for('static', filename='js/script.js') }}?v=3"></script>
</body>

</html>
